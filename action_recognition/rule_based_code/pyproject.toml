[project]
name = "HAR"
version = "0.1.0"
description = "Four-view RF-DETR basketball pose and trajectory pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # 动作识别模块只需要数值计算（检测/姿态/ReID 在 perception 模块）
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.10.0",
    "PyYAML>=6.0",
    # 可选：hoop_detection 工具与可视化
    "opencv-python>=4.8.0",
]
[tool.hatch.build]
root = "." 

[tool.hatch.build.targets.wheel]
packages = ["src/track"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
# Same as Black.
line-length = 88
# Target Python 3.10.
target-version = "py310"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # 忽略行长检查

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
order-by-type = true
