[project]
name = "HAR"
version = "0.1.0"
description = "Four-view RF-DETR basketball pose and trajectory pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "PyYAML>=6.0",
    "tqdm>=4.65.0",
    "imageio-ffmpeg>=0.6.0",
    "supervision>=0.28.0",
    "mmengine>=0.6.0,<1.0.0",
    "mmcv-lite>=2.0.0rc4,<=2.3.0",
    "insightface>=0.7.3",
    "onnxruntime-gpu==1.23.2",
    "tensorrt-cu12==11.2.1.2",
]
[tool.hatch.build]
root = "." 

[tool.hatch.build.targets.wheel]
packages = ["src/track"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
# Same as Black.
line-length = 88
# Target Python 3.10.
target-version = "py310"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # 忽略行长检查

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
order-by-type = true
