# RF-DETR-Seg 2XL + RTMPose multi-view basketball configuration
project_root: auto
data_root: /data/tt/data/videodata/11.19

model:
  insightface_name: buffalo_l

rfdetr:
  # auto: TensorRT -> ONNX Runtime (one 2XL model for person + ball)
  # hybrid: person boxes from the 2XL backend above, ball boxes from the
  #   fine-tuned checkpoint below (ball 3D-observation coverage 88.7% vs
  #   82.7% of the single model on the evaluation clip; person/pose/ReID/
  #   3D and all visualization stages are unchanged)
  backend: hybrid
  engine_path: ${project_root}/models/rfdetr-seg-2xlarge.b4.trt11.fp16.engine
  engine_precision: fp16
  onnx_path: ${project_root}/models/rfdetr-seg-2xlarge.b4.mixed-fp16.onnx
  # fine-tuned RF-DETR ball detector (used only when backend: hybrid);
  # remove or leave the path empty to fall back to the single-model backend
  ball_checkpoint_path: ${project_root}/models/finetuned/rfdetr_large_ball_player.pth
  person_threshold: 0.35
  ball_threshold: 0.16
  min_mask_pixels: 100
  min_mask_roi_ratio: 0.08
  max_player_candidates_per_view: 8
  ball_min_size: 5.0
  ball_max_size: 100.0
  ball_min_aspect: 0.35
  ball_max_aspect: 2.8
  # Empty means geometry/court bounds perform the filtering. Polygons may use
  # normalized coordinates: "0.0,0.4 1.0,0.4 1.0,1.0 0.0,1.0".
  roi_polygons:
    view1: ""
    view2: ""
    view3: ""
    view4: ""

pose:
  config: ${project_root}/third_party/mmpose_configs/body_2d_keypoint/rtmpose/coco/rtmpose-m_8xb256-420e_coco-256x192.py
  checkpoint: ${project_root}/models/rtmpose/rtmpose-m_simcc-body7_pt-body7_420e-256x192-e48f03d0_20230504.pth
  device: auto
  mmpose_site_packages: ${project_root}/third_party
  keypoint_threshold: 0.20
  triangulation_keypoint_threshold: 0.20
  min_valid_keypoints: 5
  require_human_evidence: true
  min_mean_keypoint_confidence: 0.20
  min_torso_keypoints: 0
  min_vertical_span_ratio: 0.05
  max_reprojection_error_px: 30.0
  bone_refinement_strength: 0.50
  bone_refinement_iterations: 6
  bone_reference_min_samples: 20
  bone_reference_max_reprojection_error_px: 20.0
  smoothing_alpha: 0.65
  max_keypoint_fill_frames: 15

camera:
  intrinsics_path: ${project_root}/assets/intrinsics_parameters/undistorted_intrinsics_correct.json
  extrinsics_path: ${project_root}/assets/extrinsic_parameters/extrinsics_new_calibration.json
  view_to_camera:
    view1: A1
    view2: A2
    view3: B3
    view4: B4
  # Add/subtract frames here if the recordings do not share frame zero.
  frame_offsets:
    view1: 0
    view2: 0
    view3: 0
    view4: 0
  # xmin, xmax, ymin, ymax in calibrated world metres. The videos cover one
  # 15 x 14 m half court; negative-y sideline/bench people are excluded.
  court_world_bounds: [0.0, 15.0, 0.0, 14.0]

videos:
  view1: ${data_root}/A1/A1-1_camera1_undistorted.mp4
  view2: ${data_root}/A2/A2-1_camera1_undistorted.mp4
  view3: ${data_root}/B3/B3-1_camera1_undistorted.mp4
  view4: ${data_root}/B4/B4-1_camera1_undistorted.mp4

output:
  base_dir: ${project_root}/output/rfdetr_multiview
  reid_3d_dir: ${project_root}/output/rfdetr_multiview/poses
  pipeline_dir: ${project_root}/output/rfdetr_multiview/trajectory_pipeline
  skeleton_dir: ${project_root}/output/rfdetr_multiview/skeletons_3d

reid:
  num_players: 6
  max_missing_frames: 45
  cross_view_max_ground_distance: 2.0
  temporal_max_ground_distance: 2.5
  ground_smoothing_alpha: 0.55
  cross_view_appearance_weight: 0.8
  cross_view_face_weight: 1.2
  cross_view_mask_weight: 0.2
  temporal_appearance_weight: 0.9
  temporal_face_weight: 1.4
  temporal_mask_weight: 0.55
  image_motion_weight: 0.35
  # Never let a one-camera sideline detection consume one of the six IDs.
  new_track_min_views: 2
  new_track_min_confidence: 0.50
  max_assignment_cost: 3.0
  use_appearance_embeddings: true
  use_deep_appearance_embeddings: true
  appearance_device: auto
  appearance_input_size: 160
  appearance_fp16: true
  appearance_deep_refresh_interval_packets: 1
  appearance_checkpoint: ${project_root}/models/reid/mobilenet_v2-b0353104.pth
  use_face_embeddings: true
  insightface_root: ${project_root}/models/insightface
  face_det_size: 768
  face_min_score: 0.55
  face_min_size_px: 22
  face_refresh_interval_packets: 6
  face_overlap_refresh_interval_packets: 3

ball:
  max_distance: 520.0
  max_jump: 240.0
  switch_margin: 0.25
  min_jump_quality: 0.30
  max_missed: 12
  trail: 60
  smoothing_alpha: 0.70
  output_hold_frames: 6
  max_3d_jump_m: 1.5
  # The four cameras are synchronized but their ball centres can differ by
  # tens of pixels after calibration. Static background false positives are
  # much farther away and are rejected by cross-view consensus.
  max_reprojection_error_px: 100.0
  max_height_m: 10.0
  # Fixed-camera background objects that RF-DETR repeatedly labels as balls.
  # Each entry is [center_x_px, center_y_px, radius_px].
  exclusion_zones:
    view1: [[285.0, 563.0, 40.0]]
    view4: [[255.0, 382.0, 40.0]]
  stationary_switch_frames: 8

assets:
  court_background: ${project_root}/assets/court__bg.png

trajectory:
  start_frame: 0
  process_seconds: 30
  fps: 30
  target_view: view1
  court_total_x: 15.0
  court_total_y: 28.0
  scale_ratio: 50
  generate_video: true
  topview_width: 800
  topview_height: 1400
  ball_max_gap_frames: 6
  ball_trail_seconds: 2.0

smoothing:
  jump_distance_threshold: 3.0
  speed_ratio_threshold: 8.0
  lookback_frames: 15
  moving_average_window: 7
  gaussian_sigma: 1.0

visualization:
  async_video_writer: true
  writer_queue_size: 96
  person_contour_width: 2
  unassigned_contour_width: 2
  ball_contour_width: 2
  refine_mask_contours: true
  mask_smoothing_kernel: 5
  mask_smoothing_threshold: 0.45
  draw_unassigned_contours: false
  skeleton_3d:
    animation_fps: 30
    point_radius: 3
    line_width: 3
    ball_max_gap_frames: 6
    ball_trail_seconds: 2.0

player_colors:
  - [255, 80, 80]
  - [80, 255, 80]
  - [80, 80, 255]
  - [255, 255, 80]
  - [255, 80, 255]
  - [80, 255, 255]

skeleton_connections:
  - [0, 1]
  - [0, 2]
  - [1, 3]
  - [2, 4]
  - [5, 6]
  - [5, 7]
  - [7, 9]
  - [6, 8]
  - [8, 10]
  - [5, 11]
  - [6, 12]
  - [11, 12]
  - [11, 13]
  - [13, 15]
  - [12, 14]
  - [14, 16]

hoop_detection:
  # 可选工具：src/hoop_detection/run_hoop_detection.py
  # 用 YOLO 在四视角里检测篮筐、聚类并用标定三角化 3D 篮筐位置，
  # 输出 <output.reid_3d_dir>/hoop_3d.json（动作识别模块会用到）。
  weights: ${project_root}/models/hoop_yolo.pt
  # 可选：指向动作模块产出的 ball_trajectory.json——投篮球会飞向真实篮筐，
  # 用它可以更好地在候选中锁定真篮筐
  ball_trajectory_path: ""
